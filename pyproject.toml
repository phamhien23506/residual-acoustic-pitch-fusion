[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-acoustic-pitch-fusion"
version = "1.0.0"
description = "Residual acoustic adaptation of Pitch-Fusion for Vietnamese speech emotion recognition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<26",
  "scikit-learn>=1.7,<2",
  "torch>=2.6",
  "transformers>=4.50,<5",
  "librosa>=0.11,<2",
  "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
